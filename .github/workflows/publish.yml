# 推 tag 自动发布到 npm。
#
# ──────────────────────────────────────────────────────────────────────
# 使用方式
#   1) 改版本号：   npm version patch      # 或 minor / major
#   2) 推 tag：     git push --follow-tags
#   3) 本 workflow 自动跑：校验 tag 与 package.json 一致 → 跑自检 → npm publish
#
# 首次使用前必须做一次配置（否则 publish 会 403）：
#   仓库 → Settings → Secrets and variables → Actions → New repository secret
#     名称: NPM_TOKEN
#     值:   npm 的 **Granular Access Token**，且必须勾选 **Bypass 2FA**
#          （本 npm 账号开了 2FA；普通 token 会在 CI 里被拒：E403
#           "Two-factor authentication or granular access token with bypass 2fa enabled is required"）
#          token 创建页: https://www.npmjs.com/settings/<你的用户名>/tokens
#          Packages and scopes 选 **Read and write** + **All packages**
#
# 更安全的替代（可选，无需长期 token）：npm 的 Trusted Publishing
#   在 npm 包页面 → Settings → Trusted Publisher 里绑定本仓库与本 workflow 文件名，
#   然后删掉下面的 NODE_AUTH_TOKEN（OIDC 由 id-token: write 提供）。
# ──────────────────────────────────────────────────────────────────────

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Only run npm publish --dry-run'
        type: boolean
        default: true

permissions:
  contents: read
  # npm provenance 需要：向 npm 证明这个包确实由本 workflow 构建
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG — bump the version first (npm version patch)"
            exit 1
          fi

      - name: Offline self-check (no browser, no network to any AI site)
        run: node probe/verify-plugin.mjs

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry-run }}
        run: |
          set -euo pipefail
          if [ "$IS_DISPATCH" = "true" ] && [ "$DRY_RUN_INPUT" = "true" ]; then
            echo "::notice::manual dispatch with dry-run=true — not publishing for real"
            npm publish --dry-run --access public
          else
            npm publish --access public --provenance
          fi
